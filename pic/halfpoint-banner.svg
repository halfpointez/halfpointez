<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" width="100%" height="100%">
  <defs>
    <!-- 紫色霓虹发光滤镜 -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 扫描线渐变（紫色调） -->
    <linearGradient id="scanLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0)"/>
      <stop offset="48%" stop-color="rgba(168, 85, 247, 0.05)"/>
      <stop offset="50%" stop-color="rgba(168, 85, 247, 0.25)"/>
      <stop offset="52%" stop-color="rgba(168, 85, 247, 0.05)"/>
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0)"/>
    </linearGradient>

    <!-- CRT 像素纹理 -->
    <pattern id="pixelGrid" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="rgba(10, 5, 20, 0)"/>
      <rect width="1" height="1" fill="rgba(200, 150, 255, 0.06)"/>
    </pattern>
  </defs>

  <!-- 深紫黑基底 -->
  <rect width="820" height="280" rx="8" fill="#0A0515"/>
  <rect width="820" height="280" rx="8" fill="url(#pixelGrid)"/>

  <!-- 紫色双边框 -->
  <rect width="820" height="280" rx="8" fill="none" stroke="#A855F7" stroke-width="2.5" opacity="0.8"/>
  <rect width="816" height="276" rx="6" fill="none" stroke="#C084FC" stroke-width="0.5" opacity="0.4"/>

  <!-- 左上角极简指示点（灰色） -->
  <circle cx="30" cy="30" r="5" fill="#2A1B3D"/>
  <circle cx="48" cy="30" r="5" fill="#2A1B3D"/>
  <circle cx="66" cy="30" r="5" fill="#2A1B3D"/>

  <!-- 顶部伪终端提示（极简，灰色） -->
  <text x="40" y="75" font-family="'Courier New', monospace" font-size="15" fill="#4B3A6B">user@pixel</text>
  <text x="195" y="75" font-family="'Courier New', monospace" font-size="15" fill="#A855F7">:</text>
  <text x="205" y="75" font-family="'Courier New', monospace" font-size="15" fill="#4B3A6B">~</text>
  <text x="220" y="75" font-family="'Courier New', monospace" font-size="15" fill="#A855F7">$</text>
  <text x="240" y="75" font-family="'Courier New', monospace" font-size="15" fill="#6B5B8D">echo $ID</text>

  <!-- ⭐ 核心：紫色像素风格 ID（使用 Press Start 2P 像素字体） -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    .pixel-text {
      font-family: 'Press Start 2P', 'Courier New', monospace;
      font-size: 72px;
      fill: #C084FC;
      filter: url(#neonGlow);
      text-rendering: crispEdges;
    }
  </style>
  <text x="410" y="155" text-anchor="middle" class="pixel-text">HALFPOINT</text>

  <!-- 小字版本号（像素感弱化） -->
  <text x="410" y="195" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#6B5B8D">PIXEL_EDITION // v2.0</text>

  <!-- 底部闪烁光标 -->
  <rect x="40" y="240" width="14" height="22" fill="#A855F7" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="0.8s" repeatCount="indefinite"/>
  </rect>

  <!-- 动态扫描线（紫色） -->
  <rect width="820" height="18" fill="url(#scanLine)">
    <animate attributeName="y" from="-18" to="280" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
