<svg width="700" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'Courier New', monospace; font-size: 22px; font-weight: bold; }
      .scanline {
        fill: rgba(123, 47, 190, 0.08);
        animation: scan 6s linear infinite;
      }
      .cursor {
        fill: #b07cf0;
        animation: blink 1s step-end infinite;
      }
      @keyframes scan {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- 纯黑背景 -->
  <rect width="100%" height="100%" fill="#0a0818" />

  <!-- 动态扫描线 -->
  <rect class="scanline" x="0" y="0" width="700" height="6" />

  <!-- 像素点阵文字（5行手工拼制） -->
  <text x="20" y="50" fill="#b07cf0" shape-rendering="crispEdges">
    <tspan x="20" dy="0">█   █  ███  █    █████ █████  ███  █████ █   █ █████</tspan>
    <tspan x="20" dy="30">█   █ █   █ █    █    █   █ █   █   █   ██  █   █  </tspan>
    <tspan x="20" dy="30">█████ █████ █    █████ █████ █   █   █   █ █ █   █  </tspan>
    <tspan x="20" dy="30">█   █ █   █ █    █    █    █   █   █   █  ██   █  </tspan>
    <tspan x="20" dy="30">█   █ █   █ █████ █    █    ███  █████ █   █   █  </tspan>
  </text>

  <!-- 闪烁光标（放在最后一行末尾） -->
  <rect class="cursor" x="636" y="160" width="20" height="26" />
</svg>
