<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
      * { font-family: 'Press Start 2P', monospace; }
      .bg { fill: #0d0b1a; }
      .window-border { fill: none; stroke: #7b2fbe; stroke-width: 3; rx: 12; }
      .title-bar { fill: #1a1430; }
      .title-text { fill: #b07cf0; font-size: 14px; }
      .dot { fill: #ff5f56; } .dot2 { fill: #ffbd2e; } .dot3 { fill: #27c93f; }
      .main-text { fill: #b07cf0; font-size: 72px; text-anchor: middle; }
      .sub-text { fill: #7b2fbe; font-size: 16px; text-anchor: middle; }
      .cursor { fill: #b07cf0; animation: blink 1s step-end infinite; }
      .glow { filter: drop-shadow(0 0 16px #7b2fbe); }
      .scanline { fill: rgba(123, 47, 190, 0.03); animation: scan 8s linear infinite; }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes scan {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }
    </style>
  </defs>

  <!-- 背景 -->
  <rect class="bg" width="800" height="500" rx="12" />

  <!-- 扫描线（动态） -->
  <rect class="scanline" x="0" y="0" width="800" height="8" />

  <!-- 窗口边框 -->
  <rect class="window-border" x="6" y="6" width="788" height="488" />

  <!-- 标题栏 -->
  <rect class="title-bar" x="12" y="12" width="776" height="36" rx="6" />
  <text class="title-text" x="24" y="38">HALFPOINT TERMINAL</text>
  <!-- 窗口控制按钮 -->
  <circle class="dot" cx="736" cy="30" r="7" />
  <circle class="dot2" cx="760" cy="30" r="7" />
  <circle class="dot3" cx="784" cy="30" r="7" />

  <!-- 主标志：像素风 “HALFPOINT” -->
  <text class="main-text glow" x="400" y="240">HALFPOINT</text>

  <!-- 光标（紧跟文字，模拟终端输入） -->
  <rect class="cursor" x="680" y="150" width="34" height="44" />

  <!-- 下方状态信息 -->
  <text class="sub-text" x="400" y="380">version 1.0 · ready</text>

  <!-- 装饰性像素方块（类似 Arch 的简约点缀） -->
  <rect x="360" y="440" width="12" height="12" fill="#7b2fbe" />
  <rect x="380" y="440" width="12" height="12" fill="#b07cf0" />
  <rect x="400" y="440" width="12" height="12" fill="#7b2fbe" />
  <rect x="420" y="440" width="12" height="12" fill="#b07cf0" />
  <rect x="440" y="440" width="12" height="12" fill="#7b2fbe" />

  <!-- 左下角小 logo（像素风 Arch 风格曲线简化） -->
  <rect x="24" y="440" width="16" height="16" fill="#b07cf0" />
  <rect x="40" y="440" width="16" height="16" fill="#7b2fbe" />
  <rect x="56" y="440" width="16" height="16" fill="#b07cf0" />
  <rect x="72" y="440" width="16" height="16" fill="#7b2fbe" />
</svg>
