<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
      * { font-family: 'Press Start 2P', monospace; }
      .bg { fill: #0a0818; }
      .text { fill: #b07cf0; font-size: 72px; text-anchor: middle; }
      .cursor { fill: #b07cf0; animation: blink 1s step-end infinite; }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <rect class="bg" width="600" height="200" />
  <text class="text" x="300" y="130">HALFPOINT</text>
  <rect class="cursor" x="560" y="70" width="28" height="48" />
</svg>
