<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" width="100%" height="100%">
  <defs>
    <!-- 粉紫霓虹发光（降低扩散强度，更锐利） -->
    <filter id="neonSharp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 千禧年扫描线（更细密，带紫粉噪点感） -->
    <linearGradient id="scanLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0)"/>
      <stop offset="48%" stop-color="rgba(236, 72, 153, 0.05)"/>
      <stop offset="50%" stop-color="rgba(168, 85, 247, 0.25)"/>
      <stop offset="52%" stop-color="rgba(236, 72, 153, 0.05)"/>
      <stop offset="100%" stop-color="rgba(139, 92, 246, 0)"/>
    </linearGradient>

    <!-- CRT 细纹理（千禧年屏幕颗粒感） -->
    <pattern id="crtDots" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="rgba(10, 5, 20, 0)"/>
      <rect width="1" height="1" fill="rgba(200, 150, 255, 0.04)"/>
    </pattern>

    <!-- 故障偏移用的裁剪 -->
    <clipPath id="glitchClip1">
      <rect x="0" y="50" width="820" height="20"/>
    </clipPath>
    <clipPath id="glitchClip2">
      <rect x="0" y="180" width="820" height="15"/>
    </clipPath>
  </defs>

  <!-- 1. 深紫黑基底（接近 #0A0515） -->
  <rect width="820" height="280" rx="8" fill="#0A0515"/>
  <rect width="820" height="280" rx="8" fill="url(#crtDots)"/>
  
  <!-- 2. 双边框：外框亮紫，内框极细粉 -->
  <rect width="820" height="280" rx="8" fill="none" stroke="#8B5CF6" stroke-width="2.5" opacity="0.9"/>
  <rect width="816" height="276" rx="6" fill="none" stroke="#EC4899" stroke-width="0.5" opacity="0.5"/>

  <!-- 3. 左上角极简装饰点（无红黄绿，改成统一的紫灰点，更像工业设备） -->
  <circle cx="30" cy="30" r="5" fill="#4B3A6B"/>
  <circle cx="48" cy="30" r="5" fill="#4B3A6B"/>
  <circle cx="66" cy="30" r="5" fill="#4B3A6B"/>

  <!-- 4. 顶部状态栏（极客简洁） -->
  <text x="40" y="75" font-family="'Courier New', monospace" font-size="15" fill="#6B5B8D">user@y2k_arch</text>
  <text x="210" y="75" font-family="'Courier New', monospace" font-size="15" fill="#EC4899">:</text>
  <text x="220" y="75" font-family="'Courier New', monospace" font-size="15" fill="#6B5B8D">~</text>
  <text x="240" y="75" font-family="'Courier New', monospace" font-size="15" fill="#EC4899">$</text>
  <text x="260" y="75" font-family="'Courier New', monospace" font-size="15" fill="#A78BFA"> uname -a</text>

  <!-- 5. 左侧系统信息（去掉爱心和星星，改用 ▸ 和 :） -->
  <text x="40" y="115" font-family="'Courier New', monospace" font-size="14" fill="#7C6A9E">OS ▸</text>
  <text x="130" y="115" font-family="'Courier New', monospace" font-size="14" fill="#C4B5D4">Arch Linux 2.6.32-ARCH</text>
  
  <text x="40" y="140" font-family="'Courier New', monospace" font-size="14" fill="#7C6A9E">HOST ▸</text>
  <text x="130" y="140" font-family="'Courier New', monospace" font-size="14" fill="#C4B5D4">GitHub.Pages (Y2K)</text>
  
  <text x="40" y="165" font-family="'Courier New', monospace" font-size="14" fill="#7C6A9E">UPTIME ▸</text>
  <text x="130" y="165" font-family="'Courier New', monospace" font-size="14" fill="#EC4899">42d 7h 23m</text>
  
  <text x="40" y="190" font-family="'Courier New', monospace" font-size="14" fill="#7C6A9E">SHELL ▸</text>
  <text x="130" y="190" font-family="'Courier New', monospace" font-size="14" fill="#C4B5D4">zsh 5.8 (oh-my-zsh)</text>

  <!-- 6. 右侧巨大 ARCH 文字（主色调粉紫渐变 + 故障重影） -->
  <!-- 故障红色偏移层（左下） -->
  <text x="505" y="148" font-family="'Courier New', monospace" font-size="76" font-weight="900" fill="#EC4899" opacity="0.25" filter="url(#neonSharp)">ARCH</text>
  <!-- 故障青色偏移层（右上） -->
  <text x="515" y="138" font-family="'Courier New', monospace" font-size="76" font-weight="900" fill="#22D3EE" opacity="0.2" filter="url(#neonSharp)">ARCH</text>
  <!-- 主层（粉紫发光） -->
  <text x="510" y="143" font-family="'Courier New', monospace" font-size="76" font-weight="900" fill="#C084FC" filter="url(#neonSharp)">ARCH</text>

  <!-- 右侧小字版本号（极客细节） -->
  <text x="540" y="185" font-family="'Courier New', monospace" font-size="16" fill="#6B5B8D">RELEASE 2.0.0</text>
  <text x="535" y="205" font-family="'Courier New', monospace" font-size="12" fill="#4B3A6B">BUILD: STABLE</text>

  <!-- 7. 底部闪烁方块光标（干脆利落） -->
  <rect x="40" y="240" width="14" height="22" fill="#EC4899" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="0.8s" repeatCount="indefinite"/>
  </rect>

  <!-- 8. 动态扫描线（只有一条，干净利落） -->
  <rect width="820" height="18" fill="url(#scanLine)">
    <animate attributeName="y" from="-18" to="280" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- 9. 轻微的水平故障干扰线条（静态，增加千禧年VHS感） -->
  <line x1="0" y1="95" x2="820" y2="95" stroke="#EC4899" stroke-width="1" opacity="0.15"/>
  <line x1="0" y1="220" x2="820" y2="220" stroke="#8B5CF6" stroke-width="1" opacity="0.1"/>
</svg>
