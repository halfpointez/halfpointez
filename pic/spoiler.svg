<svg width="290" height="22" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg {
      fill: #000000;
      stroke: #1A0B2E;
      stroke-width: 1px;
      rx: 4px;
      transition: all 0.25s ease;
    }
    .hint-text {
      fill: #666666;
      font-family: 'Courier New', Consolas, monospace;
      font-size: 11px;
      font-weight: bold;
      transition: opacity 0.25s ease;
    }
    .secret-text {
      fill: #FF007F;
      font-family: 'Courier New', Consolas, monospace;
      font-size: 11px;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    /* 鼠标悬停/点击时：变暗紫底色、高亮霓虹粉边框与文字 */
    svg:hover .bg {
      fill: #1A0B2E;
      stroke: #FF007F;
    }
    svg:hover .hint-text {
      opacity: 0;
    }
    svg:hover .secret-text {
      opacity: 1;
    }
  </style>

  <!-- 纯黑底框 -->
  <rect class="bg" width="100%" height="100%"/>
  
  <!-- 未悬停提示 -->
  <text class="hint-text" x="50%" y="50%" dominant-baseline="central" text-anchor="middle">[ █ █ █ HOVER TO REVEAL █ █ █ ]</text>
  
  <!-- 悬停揭晓的英文彩蛋 -->
  <text class="secret-text" x="50%" y="50%" dominant-baseline="central" text-anchor="middle">Working hard for a medal... QAQ</text>
</svg>
