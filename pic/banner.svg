<svg width="100%" height="320" viewBox="0 0 800 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. 暗色遮罩渐变：保证 Logo 和文字清晰度 -->
    <linearGradient id="bg-overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A0B2E" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1A0B2E" stop-opacity="0.88" />
    </linearGradient>

    <!-- 2. 发光粉紫边框 -->
    <linearGradient id="cyber-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>
  </defs>

  <!-- 图层 1：背景大图（更换 href 即可换背景） -->
  <image 
    href="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&amp;fit=crop&amp;w=1200&amp;q=80" 
    width="800" 
    height="320" 
    preserveAspectRatio="xMidYMid slice" 
  />

  <!-- 图层 2：暗色叠加遮罩 -->
  <rect width="800" height="320" fill="url(#bg-overlay)" rx="12" />

  <!-- 图层 3：发光外框 -->
  <rect x="1" y="1" width="798" height="318" rx="12" stroke="url(#cyber-border)" stroke-width="2" fill="none" />

  <!-- 图层 4：顶部微光问候语 -->
  <text x="50%" y="45" dominant-baseline="middle" text-anchor="middle" fill="#E0AAFF" font-family="'Courier New', monospace" font-size="14" letter-spacing="2">
    ✦ Hi ! There is Halfpoint ✦
  </text>

  <!-- 图层 5：直接嵌入你原有的 Logo (同目录下的 logo-scan.svg) -->
  <image 
    href="logo-scan.svg" 
    x="100" 
    y="70" 
    width="600" 
    height="160" 
    preserveAspectRatio="xMidYMid meet" 
  />

  <!-- 图层 6：底部状态栏 -->
  <text x="50%" y="275" dominant-baseline="middle" text-anchor="middle" fill="#E0AAFF" font-family="'Courier New', monospace" font-size="13" letter-spacing="1">
    [ Developer ] :: [ Hard Gamer ] :: [ STATUS: ONLINE ]
  </text>
</svg>
