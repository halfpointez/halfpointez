<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" width="100%" height="100%">
  <defs>
    <!-- 青绿发光效果（用于后续可选的动态元素） -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- CRT 细微扫描线纹理 -->
    <pattern id="scanlines" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="2" height="1" fill="rgba(0,0,0,0)"/>
      <rect y="1" width="2" height="1" fill="rgba(0,15,15,0.12)"/>
    </pattern>
  </defs>

  <!-- 1. 暗色背景（与顶部横幅一致） -->
  <rect width="860" height="640" rx="12" fill="#0b1119"/>
  <rect width="860" height="640" rx="12" fill="url(#scanlines)"/>

  <!-- 2. 外边框（青绿双线） -->
  <rect width="860" height="640" rx="12" fill="none" stroke="#00ffcc" stroke-width="2.5" opacity="0.7"/>
  <rect width="856" height="636" rx="10" fill="none" stroke="#00ffcc" stroke-width="0.5" opacity="0.3"/>

  <!-- 3. 窗口装饰点（极简灰） -->
  <circle cx="30" cy="30" r="5" fill="#2a3b4c"/>
  <circle cx="48" cy="30" r="5" fill="#2a3b4c"/>
  <circle cx="66" cy="30" r="5" fill="#2a3b4c"/>

  <!-- ====== 以下为终端正文，所有文字用 <text> 绘制 ====== -->
  <!-- 字体采用等宽，颜色：主色 #00ffcc，辅色 #6a8ba0，高亮 #b0d4e8 -->

  <!-- 欢迎行 -->
  <text x="40" y="80" font-family="'Courier New', monospace" font-size="16" fill="#6a8ba0">┌────────────────────────────────────────────────────────────────────────────┐</text>
  <text x="40" y="110" font-family="'Courier New', monospace" font-size="16" fill="#00ffcc">│  &lt;&lt;&lt; WELCOME TO /dev/tty1 &gt;&gt;&gt;                                            │</text>
  <text x="40" y="140" font-family="'Courier New', monospace" font-size="16" fill="#b0d4e8">│  Linux crt-terminal 6.9.2-arch1-1 #1 SMP PREEMPT_DYNAMIC x86_64 GNU/Linux│</text>
  <text x="40" y="170" font-family="'Courier New', monospace" font-size="16" fill="#6a8ba0">│                                                                          │</text>

  <!-- whoami -->
  <text x="40" y="200" font-family="'Courier New', monospace" font-size="16" fill="#00ffcc">│  &gt;_ whoami                                                              │</text>
  <text x="40" y="230" font-family="'Courier New', monospace" font-size="16" fill="#b0d4e8">│  YOUR_NAME                                                              │</text>
  <text x="40" y="260" font-family="'Courier New', monospace" font-size="16" fill="#6a8ba0">│                                                                          │</text>

  <!-- cat ~/.profile -->
  <text x="40" y="290" font-family="'Courier New', monospace" font-size="16" fill="#00ffcc">│  &gt;_ cat ~/.profile                                                      │</text>
  <text x="40" y="320" font-family="'Courier New', monospace" font-size="16" fill="#6a8ba0">│  ──────────────────────────────────────────────────────────────────         │</text>
  <text x="40" y="350" font-family="'Courier New', monospace" font-size="16" fill="#b0d4e8">│  export ROLE="Full-stack Developer"                                      │</text>
  <text x="40" y="380" font-family="'Courier New', monospace" font-size="16" fill="#b0d4e8">│  export TOOLS="Neovim | Tmux | Zellij | Systemd"                        │</text>
  <text x="40" y="410" font-family="'Courier New', monospace" font-size="16" fill="#b0d4e8">│  export LANG="Python | Go | Rust | TypeScript"                          │</text>
  <text x="40" y="440" font-family="'Courier New', monospace" font-size="16" fill="#b0d4e8">│  export FRAMEWORK="React | Next.js | Django | Axum"                    │</text>
  <text x="40" y="470" font-family="'Courier New', monospace" font-size="16" fill="#b0d4e8">│  export MOTTO="Keep it simple, keep it sharp."                          │</text>
  <text x="40" y="500" font-family="'Courier New', monospace" font-size="16" fill="#6a8ba0">│                                                                          │</text>

  <!-- curl -->
  <text x="40" y="530" font-family="'Courier New', monospace" font-size="16" fill="#00ffcc">│  &gt;_ curl -s https://api.github.com/users/YOUR_USERNAME | jq '.bio'     │</text>
  <text x="40" y="560" font-family="'Courier New', monospace" font-size="16" fill="#b0d4e8">│  "Building robust systems and clean interfaces."                        │</text>
  <text x="40" y="590" font-family="'Courier New', monospace" font-size="16" fill="#6a8ba0">│                                                                          │</text>

  <!-- 底边线 -->
  <text x="40" y="620" font-family="'Courier New', monospace" font-size="16" fill="#6a8ba0">└────────────────────────────────────────────────────────────────────────────┘</text>

</svg>
