<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="100%" height="100%">
  <defs>
    <!-- 青绿霓虹发光 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- CRT 扫描线渐变 -->
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0, 255, 204, 0)"/>
      <stop offset="48%" stop-color="rgba(0, 255, 204, 0.03)"/>
      <stop offset="50%" stop-color="rgba(0, 255, 204, 0.2)"/>
      <stop offset="52%" stop-color="rgba(0, 255, 204, 0.03)"/>
      <stop offset="100%" stop-color="rgba(0, 255, 204, 0)"/>
    </linearGradient>

    <!-- 屏幕像素网格纹理 -->
    <pattern id="crtGrid" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect width="2" height="1" fill="rgba(0,0,0,0)"/>
      <rect y="1" width="2" height="1" fill="rgba(0,10,10,0.15)"/>
    </pattern>
  </defs>

  <!-- 基底 -->
  <rect width="820" height="260" rx="10" fill="#0b1119"/>
  <rect width="820" height="260" rx="10" fill="url(#crtGrid)"/>
  
  <!-- 外框：双线 CRT 边框 -->
  <rect width="820" height="260" rx="10" fill="none" stroke="#00ffcc" stroke-width="2.5" opacity="0.7"/>
  <rect width="816" height="256" rx="8" fill="none" stroke="#00ffcc" stroke-width="0.5" opacity="0.3"/>

  <!-- 窗口标题栏（极简灰点） -->
  <circle cx="30" cy="30" r="5" fill="#2a3b4c"/>
  <circle cx="48" cy="30" r="5" fill="#2a3b4c"/>
  <circle cx="66" cy="30" r="5" fill="#2a3b4c"/>

  <!-- 提示符行 -->
  <text x="40" y="70" font-family="'Courier New', monospace" font-size="16" fill="#6a8ba0">user@crt</text>
  <text x="185" y="70" font-family="'Courier New', monospace" font-size="16" fill="#00ffcc">:</text>
  <text x="195" y="70" font-family="'Courier New', monospace" font-size="16" fill="#6a8ba0">~</text>
  <text x="210" y="70" font-family="'Courier New', monospace" font-size="16" fill="#00ffcc">$</text>
  <text x="230" y="70" font-family="'Courier New', monospace" font-size="16" fill="#8badcb"> neofetch</text>

  <!-- 系统信息（精简冷调） -->
  <text x="40" y="110" font-family="'Courier New', monospace" font-size="14" fill="#6a8ba0">OS</text>
  <text x="110" y="110" font-family="'Courier New', monospace" font-size="14" fill="#b0d4e8">Arch Linux x86_64</text>
  
  <text x="40" y="135" font-family="'Courier New', monospace" font-size="14" fill="#6a8ba0">Host</text>
  <text x="110" y="135" font-family="'Courier New', monospace" font-size="14" fill="#b0d4e8">GitHub Pages (CRT)</text>
  
  <text x="40" y="160" font-family="'Courier New', monospace" font-size="14" fill="#6a8ba0">Uptime</text>
  <text x="110" y="160" font-family="'Courier New', monospace" font-size="14" fill="#00ffcc">42 days, 7h 23m</text>

  <text x="40" y="185" font-family="'Courier New', monospace" font-size="14" fill="#6a8ba0">Shell</text>
  <text x="110" y="185" font-family="'Courier New', monospace" font-size="14" fill="#b0d4e8">zsh 5.9 (powerlevel10k)</text>

  <!-- 右侧 CRT 大字（双影故障偏移，增强屏幕感） -->
  <text x="530" y="140" font-family="'Courier New', monospace" font-size="70" font-weight="900" fill="#00ffcc" opacity="0.15" filter="url(#glow)">CRT</text>
  <text x="525" y="135" font-family="'Courier New', monospace" font-size="70" font-weight="900" fill="#00aaff" opacity="0.15">CRT</text>
  <text x="520" y="143" font-family="'Courier New', monospace" font-size="70" font-weight="900" fill="#00ffcc" filter="url(#glow)">CRT</text>
  <text x="550" y="180" font-family="'Courier New', monospace" font-size="18" fill="#6a8ba0">TERMINAL</text>
  <text x="555" y="200" font-family="'Courier New', monospace" font-size="12" fill="#2a3b4c">SCAN: 60Hz</text>

  <!-- 底部闪烁光标 -->
  <rect x="40" y="225" width="14" height="22" fill="#00ffcc" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="0.8s" repeatCount="indefinite"/>
  </rect>

  <!-- CRT 动态扫描线（一条光带从上往下） -->
  <rect width="820" height="20" fill="url(#scan)">
    <animate attributeName="y" from="-20" to="260" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
